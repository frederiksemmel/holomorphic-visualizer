<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Conformal Map Visualizer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100dvh;
        overflow: hidden;
        background: #050505;
        color: #bbb;
        font: 15px/1.5 system-ui, sans-serif;
      }
      /* Bevy fits the canvas to <body>, which fills the viewport. */
      canvas {
        display: block;
        touch-action: none;
        outline: none;
      }
      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        text-align: center;
      }
      #source {
        position: fixed;
        z-index: 1;
        right: 12px;
        bottom: 8px;
        color: #777;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading the visualizer…</div>
    <a id="source" href="https://github.com/frederiksemmel/holomorphic-visualizer">source on GitHub</a>
    <script type="module">
      const status = document.getElementById("status");
      if (!navigator.gpu) {
        status.innerHTML =
          "This needs a browser with WebGPU: Chrome or Edge, Safari 26 or newer, " +
          "or Firefox 141 or newer on Windows.";
      } else {
        // The message goes once Bevy has put its canvas on the page.
        new MutationObserver((_, observer) => {
          if (document.querySelector("canvas")) {
            status.remove();
            observer.disconnect();
          }
        }).observe(document.body, { childList: true });

        import("./app.js")
          .then((app) => app.default())
          .catch((error) => {
            // winit leaves its start-up through this exception on purpose.
            if (String(error).includes("Using exceptions for control flow")) return;
            status.textContent = "The visualizer failed to start: " + error;
            console.error(error);
          });
      }
    </script>
  </body>
</html>
