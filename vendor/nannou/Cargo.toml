[package]
edition = "2024"
name = "nannou"
version = "0.20.0"
authors = ["mitchmindtree <mitchell.nordine@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A Creative Coding Framework for Rust."
homepage = "https://nannou.cc"
readme = "README.md"
keywords = [
    "creative",
    "sketch",
    "graphics",
    "audio",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nannou-org/nannou.git"
resolver = "2"

[features]
basis-universal = ["bevy/basis-universal"]
bmp = ["bevy/bmp"]
dds = ["bevy/dds"]
default = [
    "jpeg",
    "multi_threaded",
    "notosans",
    "png",
    "system_font_discovery",
    "wayland",
    "x11",
    "webgl2",
]
egui = [
    "dep:bevy_egui",
    "bevy_egui/immutable_ctx",
]
exr = ["bevy/exr"]
ff = ["bevy/ff"]
gif = ["bevy/gif"]
hdr = ["bevy/hdr"]
hot_reload = [
    "bevy/file_watcher",
    "bevy/multi_threaded",
]
ico = ["bevy/ico"]
jpeg = ["bevy/jpeg"]
ktx2 = ["bevy/ktx2"]
multi_threaded = ["bevy/multi_threaded"]
nightly = ["nannou_draw/nightly"]
notosans = ["nannou_draw/notosans"]
png = ["bevy/png"]
pnm = ["bevy/pnm"]
qoi = ["bevy/qoi"]
serde = [
    "dep:serde",
    "toml",
    "serde_json",
    "nannou_core/serde",
]
system_font_discovery = ["nannou_draw/system_font_discovery"]
tga = ["bevy/tga"]
tiff = ["bevy/tiff"]
trace = ["bevy/trace"]
trace_chrome = ["bevy/trace_chrome"]
trace_tracy = ["bevy/trace_tracy"]
video = ["nannou_video"]
wayland = ["bevy/wayland"]
webgl2 = ["bevy/webgl2"]
webp = ["bevy/webp"]
x11 = ["bevy/x11"]

[lib]
name = "nannou"
path = "src/lib.rs"

[[test]]
name = "geom_tests"
path = "tests/geom_tests.rs"

[[test]]
name = "shader_model_tests"
path = "tests/shader_model_tests.rs"

[dependencies.bevy]
version = "0.19.0"
features = [
    "bevy_log",
    "bevy_post_process",
    "bevy_window",
    "bevy_winit",
]
default-features = false

[dependencies.bevy_egui]
version = "0.40.0"
optional = true

[dependencies.find_folder]
version = "0.3"

[dependencies.lyon]
version = "1.0"

[dependencies.nannou_core]
version = "0.20.0"
features = ["std"]

[dependencies.nannou_derive]
version = "0.20.0"

[dependencies.nannou_draw]
version = "0.20.0"

[dependencies.nannou_video]
version = "0.20.0"
optional = true

[dependencies.nannou_wgpu]
version = "0.20.0"
features = ["capturer"]

[dependencies.noise]
version = "0.9"

[dependencies.pennereq]
version = "0.3"

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dependencies.serde_json]
version = "1"
optional = true

[dependencies.toml]
version = "1"
optional = true

[dependencies.walkdir]
version = "2"

[dependencies.wgpu]
version = "29"

[dev-dependencies.bevy]
version = "0.19.0"
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.image]
version = "0.25"
features = ["default"]
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.tokio]
version = "1"
features = ["full"]

[target.'cfg(target_arch = "wasm32")'.dependencies.bevy]
version = "0.19.0"
features = ["webgpu"]
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.image]
version = "0.25"
features = []
default-features = false

[target.'cfg(target_arch = "wasm32")'.dependencies.tokio]
version = "1"
features = ["rt"]
