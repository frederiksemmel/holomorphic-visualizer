[package]
name = "conformal-visualizer"
version = "0.2.0"
authors = ["Frederik Semmel <frederiksemmel@gmail.com>"]
edition = "2024"

[[bin]]
name = "conformal-visualizer"
path = "src/main.rs"

[dependencies]
# Default features off: on the web they would add WebGL2 next to WebGPU, a
# bundled font and image decoders, none of which the app uses, to the download.
nannou = { version = "0.20", default-features = false, features = ["egui"] }
# Same version nannou uses; its derives (shader models) expect `bevy` in scope.
bevy = { version = "0.19", default-features = false }
num = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# nannou's default features, minus WebGL2 (web only).
nannou = { version = "0.20", features = [
    "jpeg",
    "multi_threaded",
    "notosans",
    "png",
    "system_font_discovery",
    "wayland",
    "x11",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Reads and updates the page URL (the shared link).
web-sys = { version = "0.3", features = ["History", "Location", "Window"] }
wasm-bindgen = "0.2"

[dev-dependencies]
# Checks in tests that generated shader code compiles. Same version as wgpu uses.
naga = { version = "29", features = ["wgsl-in"] }
# Writes the app icons (examples/icon.rs).
png = "0.18"

[profile.dev]
# Bevy is slow unoptimized; keep debug builds usable.
opt-level = 1

[patch.crates-io]
# nannou 0.20.0 with fixes for the web build (vendor/nannou, src/app.rs and
# src/window.rs): its default web window passed a float resolution, which
# doesn't compile against Bevy 0.19 (upstream PR nannou-org/nannou#1100), and
# it now fills its parent element and keeps that size when the app configures
# the window, instead of taking the desktop resolution. Drop once upstream has both.
nannou = { path = "vendor/nannou" }

[profile.web]
# The browser build (web/build.sh): smaller download over a faster build.
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.web-dev]
# For trying the browser build locally (`WEB_PROFILE=web-dev web/build.sh`):
# whole-program LTO over all of Bevy in one codegen unit takes minutes even
# after a one-line change; this links in seconds, for a bigger download.
inherits = "web"
lto = false
codegen-units = 16
incremental = true
