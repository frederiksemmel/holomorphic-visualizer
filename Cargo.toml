[package]
name = "conformal-visualizer"
version = "0.2.0"
authors = ["Frederik Semmel <frederiksemmel@gmail.com>"]
edition = "2024"

[[bin]]
name = "conformal-visualizer"
path = "src/main.rs"

[dependencies]
eframe = "0.34"
num = "0.4"

[dev-dependencies]
criterion = "0.7"

[[bench]]
name = "gridlines"
harness = false

[profile.dev]
# Gridline generation is hot; keep debug builds usable.
opt-level = 1
